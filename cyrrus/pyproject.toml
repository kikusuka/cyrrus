[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyrrus"
version = "0.1.0"
description = "Context routing for LLM calls. Decides what goes into the prompt so you don't have to send everything every time."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "AGPL-3.0"}
dependencies = []

[project.optional-dependencies]
embeddings = ["fastembed", "numpy"]

[project.scripts]
cyrrus = "cyrrus.cli:main"

[project.urls]
Homepage = "https://github.com/kikusuka/cyrrus"
Issues = "https://github.com/kikusuka/cyrrus/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cyrrus*"]

[tool.setuptools.package-data]
cyrrus = ["py.typed"]

# threshold_calibration.py is a dev/research tool, not user-facing.
# It lives in the repo but doesn't ship in the pip package.
[tool.setuptools.exclude-package-data]
cyrrus = ["threshold_calibration.py"]
